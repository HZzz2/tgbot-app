[package]
name = "tgbot-app"
version = "0.2.14"
edition = "2021"
authors = ["HZzz2", "Leslie", "hzzz2yb@gmail.com"]
repository = "https://github.com/HZzz2/tgbot-app"
description = "Telegram Bot助手"
keywords = ["Telegram", "bot", "assistant","telegram","TGBot"]
# default-run = "tgbot-app"

[dependencies]
# Telegram Bot API
ferrisgram = "0.2.1"
# log
tklog = "0.3.0"
serde_derive = "1.0.228"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6+spec-1.1.0"
# anyhow = "1.0.86"
anyhow = { version = "1.0.104", default-features = false }
once_cell = "1.21.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "socks"] }
tokio = { version = "1.53.2", features = ["full"] }
# rusty_ytdl = "0.7.4"   # 目前无法下载油管
# ssh brute
async-ssh2-tokio = "0.13.0"
async-channel = "2.5.0"
# email send
resend-rs = "0.34.0"
tokio-cron-scheduler = "0.15.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"


# [profile.release]
# lto = true   # 2024年7月27日 release size 24MB -> 19MB
# panic = "abort" # size 19MB -> 16MB
